name: Build Android Debug APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Ujalaa Dairy Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Dependencies & Build Production Bundle
        run: |
          npm install
          npm run build

      - name: Install Capacitor Android & Sync Web Assets
        run: |
          npm install --no-save @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Ujalaa-Dairy-debug.apk

      - name: Upload Debug APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ujalaa-Dairy-debug-apk
          path: Ujalaa-Dairy-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Ujalaa Dairy Android Debug APK (Build #${{ github.run_number }})"
          body: |
            ## Ujalaa Dairy — Android Debug APK
            
            - **Direct APK Download**: Click **`Ujalaa-Dairy-debug.apk`** under **Assets** below to download and install directly on your Android phone.
            - **Package ID**: `com.ujalaadairy.app`
            - **App Name**: `Ujalaa Dairy`
            - **Commit**: `${{ github.sha }}`
          files: |
            Ujalaa-Dairy-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
