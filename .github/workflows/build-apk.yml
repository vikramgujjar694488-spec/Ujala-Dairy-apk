name: Build Android Debug APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Ujalaa Dairy Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Pre-installed Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Normalize Public NPM Versions & Build Production Web App
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "lucide-react": "^0.468.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "tesseract.js": "^5.1.1",
              "xlsx": "^0.18.5"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.0",
              "@types/node": "^22.0.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.4",
              "tailwindcss": "^4.0.0",
              "typescript": "~5.7.2",
              "vite": "^6.0.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          rm -f package-lock.json bun.lock
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android & Sync Web Assets
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          rm -rf android
          npx cap add android
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let xml = fs.readFileSync(manifestPath, "utf8");
              const perms = [
                "<uses-permission android:name=\"android.permission.CAMERA\" />",
                "<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />",
                "<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />",
                "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />"
              ].join("\n    ");
              if (!xml.includes("android.permission.CAMERA")) {
                xml = xml.replace("<uses-permission android:name=\"android.permission.INTERNET\" />", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    " + perms);
              }
              if (!xml.includes("usesCleartextTraffic")) {
                xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
              }
              fs.writeFileSync(manifestPath, xml);
            }
          '
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Ujalaa-Dairy-debug.apk
          ls -lh ../Ujalaa-Dairy-debug.apk

      - name: Upload Debug APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ujalaa-Dairy-debug-apk
          path: Ujalaa-Dairy-debug.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Ujalaa Dairy Android Debug APK (Build #${{ github.run_number }})"
          body: |
            ## Ujalaa Dairy — Android Debug APK (Latest Update)
            
            - **Direct APK Download**: Click **`Ujalaa-Dairy-debug.apk`** under **Assets** below to download and install directly on your Android phone.
            - **Included Features**:
              - Photo Milk Entry Preview Table (Date, Shift, Farmer Code, Name, Cow/Buffalo, FAT, SNF, Liters, Rate, Amount) before saving
              - Max 2 Milk Entries per Farmer per Shift (1 Cow + 1 Buffalo) & strict duplicate blocking
              - 10-Day Billing Period selection in Payments (`1-10`, `11-20`, `21-End`) with automatic under/over-payment carry-forward adjustment in bills
              - Auto Today's Date & 12:00 PM Noon Shift switching, Gallery & Camera photo support, 10-Day Sale Bill, and APK-ready Backup/Restore
            - **Package ID**: `com.ujalaadairy.app`
            - **App Name**: `Ujalaa Dairy`
            - **Commit**: `${{ github.sha }}`
          files: |
            Ujalaa-Dairy-debug.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
